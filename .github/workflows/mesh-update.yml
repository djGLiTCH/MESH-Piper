# Each Monday, and whenever started by hand, looks for a newer Piper to build. By default that is Piper's latest
# release; started by hand with "main", it is Piper's main, for a fix MESH needs before Piper releases it. Where that
# commit is not already in the commit in .github/PIPER_COMMIT, merges it into the piper-update branch with
# PIPER_COMMIT moved on, builds and tests every platform there, and opens a pull request into mesh naming the release
# it will make. Merging that pull request builds again and publishes the release (mesh-build.yml).
name: Follow Piper's releases

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      follow:
        description: "What of Piper's to build"
        type: choice
        options:
          - release
          - main
        default: release

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    name: Merge Piper's newer release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: mesh
          fetch-depth: 0

      - name: Merge, push and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          FOLLOW: ${{ inputs.follow || 'release' }}
        run: |
          git remote add upstream https://github.com/OHF-Voice/piper1-gpl.git
          old="$(tr -d '[:space:]' < .github/PIPER_COMMIT)"
          if [ "$FOLLOW" = "main" ]; then
            git fetch -q --no-tags upstream main
            new="$(git rev-parse upstream/main)"
            what="Piper's main"
          else
            # Piper's latest release that is not a pre-release, its tag fetched apart from this repository's own tags.
            release="$(gh release view --repo OHF-Voice/piper1-gpl --json tagName --jq .tagName)"
            git fetch -q --no-tags upstream "refs/tags/$release:refs/piper-tags/$release"
            new="$(git rev-parse "refs/piper-tags/$release^{commit}")"
            what="Piper's release $release"
          fi
          # A commit already in the one built, such as a release older than the main this repository follows, needs
          # nothing.
          if git merge-base --is-ancestor "$new" "$old"; then
            echo "$what (${new:0:7}) is already in the Piper this repository builds (${old:0:7}), so there is nothing to build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -q -C piper-update
          # Only this repository's own files under .github differ from Piper's, so a merge that stops is said and
          # left for a person.
          if ! git merge -q --no-ff --no-commit "$new"; then
            git merge --abort || true
            echo "$what does not merge cleanly into mesh. Merge it by hand." >&2
            exit 1
          fi
          # GitHub never lets this job's token change a workflow file, so the merge keeps mesh's own
          # .github/workflows, and Piper's changes to its workflows stay out. The build runs on mesh-build.yml.
          git reset -q HEAD -- .github/workflows
          git checkout -q HEAD -- .github/workflows
          git clean -fdq -- .github/workflows
          printf '%s\n' "$new" > .github/PIPER_COMMIT
          git add .github/PIPER_COMMIT
          git commit -q -m "Build $what at ${new:0:7}, on $(date -u +%Y-%m-%d)"
          tag="$(bash .github/mesh-version.sh)"
          git push -q -f origin piper-update
          {
            echo "$what is at \`${new:0:7}\`, past the \`${old:0:7}\` this repository builds. Merging this builds all"
            echo "five platforms again and publishes the release **$tag**."
            echo
            echo "Merge it with **Create a merge commit**, so Piper's history stays whole."
            echo
            if git diff --quiet "$old" "$new" -- libpiper; then
              echo "Nothing in \`libpiper\` changed, so the program is built from the same code."
            else
              echo "\`libpiper\` changed:"
              echo
              echo '```'
              git diff --stat "$old" "$new" -- libpiper | tail -25
              echo '```'
            fi
            echo
            echo "Piper's commits since the last build:"
            echo
            echo '```'
            git log --oneline "$old..$new" | head -40
            echo '```'
          } > body.md
          # This repository is a fork with Piper's as its upstream remote, which gh would take as its base, so each gh
          # call names this repository.
          repo="$GITHUB_REPOSITORY"
          if [ "$(gh pr list --repo "$repo" --head piper-update --base mesh --state open --json number --jq length)" = "0" ]; then
            gh pr create --repo "$repo" --base mesh --head piper-update --title "Build $what as $tag" --body-file body.md
          else
            gh pr edit piper-update --repo "$repo" --title "Build $what as $tag" --body-file body.md
          fi
          # A run started this way, unlike a push by this job, starts the build on the branch it names.
          gh workflow run mesh-build.yml --repo "$repo" --ref piper-update
